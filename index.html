<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
    // Only add base href on GitHub Pages — NOT on Live Server
    if (location.hostname === "fcrpfhp.github.io") {
        document.write('<base href="/fhp-website/">');
    }
</script>

    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body class="index-page">

<div data-include="Pages/components/header-root.html"></div>


    <!-- HEADER BANNER -->
    <div class="banner-rotator">
  <img class="banner-img active" src="assets/headerforwebsite.png">
  <img class="banner-img" src="">
</div>


    <div class="banner-title">
        <h1>Florida Highway Patrol</h1>
        <h2>Florida Coast Roleplay — Department Homepage</h2>
    </div>

    <!-- TWO GRAY BOXES -->
    <div class="two-col-section">
        <a href="Pages/career-opportunities.html" class="col hover-card" data-img="assets/careerop.png">
            <div class="bg"></div>
            <h3>Career Opportunities</h3>
            <p class="col-link">See What is Available →</p>
        </a>

        <a href="Pages/streamline.html" class="col hover-card" data-img="assets/streamline.png">
            <div class="bg"></div>
            <h3>FHP Streamline Hiring Event</h3>
            <p class="col-link">Register Today →</p>
        </a>
    </div>

    <!-- APPLY BUTTON -->
    <div class="apply-wrapper">
        <div class="nav-divider"></div>
        <img src="assets/applynow.png" class="apply-btn" onclick="window.location='Pages/apply-now.html'">
    </div>

<div class="whyapply-wrapper">
    <img src="assets/whyapply.png" class="whyapply-img">

    <!-- INVISIBLE CLICK ZONES -->
    <a href="Pages/why-apply.html" class="learnmore-zone"></a>
    <a href="Pages/apply-now.html" class="trooper-zone"></a>
</div>

    <!-- FOOTER -->
    <div class="footer-section"></div>

<script>
document.querySelectorAll('.hover-card').forEach(card => {
    const img = card.getAttribute('data-img');
    card.querySelector('.bg').style.backgroundImage = `url(${img})`;
});
</script>

<script src="js/include.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const images = [
    "assets/headerforwebsite.png",
    "assets/winter1.png",
    "assets/ciu1.png",
    "assets/fto3.png",
    "assets/academy1.png",
    "assets/ciu2.png",
    "assets/cve1.png",
    "assets/srt2.png",
    "assets/air1.png",
    "assets/cve3.png",
    "assets/thi2.png",
    "assets/careerop.png",
    "assets/air2.png",
    "assets/ciu3.png",
    "assets/academy3.png",
    "assets/bcii1.png",
    "assets/academy2.png",
    "assets/bcii3.png"
  ];

  const slides = document.querySelectorAll(".banner-rotator .banner-img");
  let index = 0;

  if (slides.length !== 2) {
    console.error("Banner rotator: expected 2 images, found", slides.length);
    return;
  }

  setInterval(() => {
    const current = slides[0].classList.contains("active") ? slides[0] : slides[1];
    const next = current === slides[0] ? slides[1] : slides[0];

    index = (index + 1) % images.length;
    next.src = images[index];

    next.classList.add("active");
    current.classList.remove("active");
  }, 5000);
});
</script>

</body>
</html>
